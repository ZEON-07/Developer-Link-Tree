<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Link Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main-container" class="container">
    <header class="profile-header">
      <img
        src="https://api.dicebear.com/7.x/bottts/svg?seed=developer"
        alt="Profile Avatar"
        class="profile-img"
        width="120"
        height="120"
      >
      <h1 class="profile-name">Alex Dev</h1>
      <p class="profile-bio">Full Stack Developer & Open Source Enthusiast</p>
    </header>

    <section class="links-section">
      <a href="https://github.com" class="link-btn" target="_blank" rel="noopener noreferrer">
        GitHub Profile
      </a>
    </section>
  </main>
</body>
</html>
