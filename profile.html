<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Developer Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="profile.js" defer></script>
</head>
<body>
  <main id="main-container" class="container profile-page">
    <section class="profile-card" id="profile-card" aria-labelledby="profile-name">
      <header class="profile-header">
        <img
          src="https://api.dicebear.com/7.x/bottts/svg?seed=developer"
          alt="Alex Dev's profile picture"
          class="profile-img"
          id="profile-picture"
          width="120"
          height="120"
        >
        <h1 class="profile-name" id="profile-name">Alex Dev</h1>
        <p class="profile-username" id="profile-username">@alexdev</p>
        <p class="profile-bio" id="profile-bio">Full Stack Developer &amp; Open Source Enthusiast</p>
      </header>

      <section class="links-section" aria-label="Profile links">
        <a href="https://github.com" class="link-btn" id="github-link" target="_blank" rel="noopener noreferrer" hidden>
          GitHub Profile
        </a>
        <a href="https://linkedin.com" class="link-btn" id="linkedin-link" target="_blank" rel="noopener noreferrer" hidden>
          LinkedIn Profile
        </a>
      </section>

    </section>

    <section class="empty-profile" id="empty-profile" aria-labelledby="empty-profile-heading" hidden>
      <h1 id="empty-profile-heading">No saved profile yet</h1>
      <p class="profile-status" id="profile-status" role="status" aria-live="polite">Save your profile in the editor to see it here.</p>
      <a class="save-btn" href="index.html">Go to profile editor</a>
    </section>

    <nav class="profile-page-actions" aria-label="Profile actions">
      <a class="text-link" href="index.html">Edit profile</a>
    </nav>
  </main>
</body>
</html>
